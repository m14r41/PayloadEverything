<!--
  CHM RCE Payload — Command Execution via Compiled HTML Help

  Attack Vector:
    Many desktop apps open .chm help files. If the app opens CHM from
    user-controlled paths, or if a CHM can be placed in the help directory,
    arbitrary commands execute when the CHM is opened.

  Build:
    1. Save this as content.html
    2. Create a .hhp project file (see chm_project.hhp)
    3. Compile: hhc.exe project.hhp → produces payload.chm
    4. Alternative: use nishang's Out-CHM or use the build script

  Test Scenarios:
    - Application loads .chm from a writable path
    - Application opens .chm via file association
    - User is tricked into opening .chm from a share
    - .chm file is embedded in a .zip import
-->

<head>
<title>Application Help Guide</title>
</head>
